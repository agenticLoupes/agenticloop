<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="loupein-arch-title loupein-arch-desc">
  <title id="loupein-arch-title">LOUPEIN architecture</title>
  <desc id="loupein-arch-desc">Architecture showing a phone-width Next.js UI and a voice page calling a FastAPI API, which runs a LangGraph pipeline of four agents; the Guardian reads Supabase Postgres only through deterministic record tools, the Skeptic asks TypeSafe Jev for a verdict, and Gemini provides reasoning and the live voice session.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="24" y="40" width="200" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="160" y="44" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="186" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLINIC</text>

  <rect x="264" y="40" width="360" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="272" y="44" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="328" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">BACKEND · LANGGRAPH</text>

  <!-- arrows (drawn before boxes) -->
  <!-- UI -> API -->
  <line x1="200" y1="112" x2="304" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="222" y="92" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="252" y="101" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP · POLL</text>
  <!-- Live page -> API -->
  <path d="M 200,228 H 244 Q 252,228 252,220 V 136 Q 252,128 260,128 H 304" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
  <!-- API -> Interpreter -->
  <line x1="376" y1="144" x2="376" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Interpreter -> Guardian -->
  <line x1="376" y1="220" x2="376" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Guardian -> Skeptic -->
  <line x1="376" y1="304" x2="376" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="384" y="312" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="420" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANDIDATES</text>
  <!-- Skeptic -> Composer -->
  <line x1="376" y1="380" x2="376" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="384" y="388" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="428" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SURVIVORS ONLY</text>
  <!-- Guardian -> record tools -->
  <line x1="448" y1="280" x2="496" y2="280" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- record tools -> Postgres -->
  <line x1="608" y1="280" x2="672" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="616" y="260" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="640" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>
  <!-- Skeptic -> Jev -->
  <line x1="448" y1="360" x2="672" y2="360" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="520" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="560" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>
  <!-- Guardian -> Gemini (reasoning): exits Guardian top-right, up, right into Gemini -->
  <path d="M 448,268 H 464 Q 472,268 472,260 V 172 Q 472,164 480,164 H 672" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="540" y="144" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text x="578" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REASONING</text>
  <!-- Live page -> Gemini Live (voice): dashed, leaves the clinic zone on the left and runs above both zones -->
  <path d="M 56,228 H 48 Q 40,228 40,220 V 32 Q 40,24 48,24 H 720 Q 728,24 728,32 V 140" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
  <rect x="380" y="4" width="92" height="12" rx="2" fill="#f5f5f5"/>
  <text x="426" y="13" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOICE SESSION</text>

  <!-- nodes -->
  <!-- Next.js UI -->
  <rect x="56" y="88" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="88" width="144" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="128" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phone-width UI</text>
  <text x="128" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js 16 · :3000</text>
  <!-- Live voice page -->
  <rect x="56" y="204" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="204" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="128" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hands-free voice</text>
  <text x="128" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/live · mic + camera</text>

  <!-- FastAPI -->
  <rect x="304" y="96" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="96" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="376" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
  <text x="376" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /investigations</text>
  <!-- Context Interpreter -->
  <rect x="304" y="180" width="144" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="180" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="376" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context Interpreter</text>
  <!-- Guardian (focal) -->
  <rect x="304" y="256" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="256" width="144" height="48" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
  <text x="376" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guardian Investigator</text>
  <text x="376" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ReAct loop · chooses what to open</text>
  <!-- Skeptic -->
  <rect x="304" y="340" width="144" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="340" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="376" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skeptic / Verifier</text>
  <text x="376" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">challenges every candidate</text>
  <!-- Composer -->
  <rect x="304" y="416" width="144" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="416" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="376" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Assist Composer</text>
  <text x="376" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cards · no advice added</text>
  <!-- Record tools (boundary) -->
  <rect x="496" y="256" width="112" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="496" y="256" width="112" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="552" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record tools</text>
  <text x="552" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">9 deterministic queries</text>

  <!-- Gemini -->
  <rect x="672" y="140" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="672" y="140" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="744" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini</text>
  <text x="744" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reasoning + Live voice</text>
  <!-- Postgres -->
  <rect x="672" y="256" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="672" y="256" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="744" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase Postgres</text>
  <text x="744" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">synthetic records · 10 tables</text>
  <!-- TypeSafe Jev -->
  <rect x="672" y="336" width="144" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="672" y="336" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="744" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TypeSafe Jev</text>
  <text x="744" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SURFACE · DISMISS · VERIFY</text>

  <!-- legend -->
  <line x1="24" y1="464" x2="856" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="24" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="96" y="476" width="12" height="8" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
  <text x="116" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL AGENT</text>
  <rect x="216" y="476" width="12" height="8" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="236" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DETERMINISTIC BOUNDARY</text>
  <line x1="400" y1="480" x2="424" y2="480" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="432" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HTTP / EXTERNAL</text>
  <line x1="560" y1="480" x2="584" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="592" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OPTIONAL VOICE PATH</text>
  <line x1="736" y1="480" x2="760" y2="480" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="768" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INTERNAL</text>
</svg>