[project]
name = "dentassist-backend"
version = "0.1.0"
description = "DentAssist Guardian backend — pre-procedure record-review agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",  # required by the /uploads/imaging form endpoint
    "psycopg[binary,pool]",
    "langgraph",
    "langchain-google-genai",
    "google-genai",
    "typesafe-sdk",
    "httpx",
    "ddgs",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
local = ["langchain-ollama"]  # ADVISOR_PROVIDER=ollama (offline advisor development)

[tool.pytest.ini_options]
pythonpath = ["."]
